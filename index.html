      var bx2=W/2+w/2-U*5,bw3=U*3.8;g.fillStyle='rgba(255,255,255,.14)';rr(bx2,cy-U*.14,bw3,U*.28,U*.14);g.fill();g.fillStyle=col;rr(bx2,cy-U*.14,Math.max(U*.28,bw3*fr),U*.28,U*.14);g.fill()};
    if(ball.gh>0)tm(H-U*3.4,'Ghost',ball.gh/120,'#d9a8ff');
    if(ball.sl>0)tm(H-U*(ball.gh>0?5.9:3.4),'Slow motion',ball.sl/180,'#7dff9a');
    var zr1=rows[Math.floor(ball.z)],zn1=zr1&&zr1.zn&&zr1.zn[0];
    if(zn1&&ZL[zn1]){var zw=U*9.4,zh=U*2,zy=H-U*(3.4+2.5*((ball.gh>0?1:0)+(ball.sl>0?1:0)));panel(W/2-zw/2,zy-zh/2,zw,zh,zh/2,PANEL,ZC[zn1]);tx(ZL[zn1],W/2-zw/2+U*1.2,zy+U*.27,U*.72,TXT1,600,'left');g.fillStyle=ZC[zn1];g.beginPath();g.arc(W/2+zw/2-U*1.3,zy,U*.3,0,7);g.fill()}
    if(PL.length){var nc=(zn1&&ZL[zn1]?1:0)+(ball.gh>0?1:0)+(ball.sl>0?1:0);g.font='600 '+U*.95+'px '+FONT;
      PL.forEach(function(p,ix){var pa=Math.min(1,p.l/20),pw3=g.measureText(p.s).width+U*3.6,ph3=U*2.2,pcy=H-U*(3.4+2.5*(nc+ix)),py3=pcy-ph3/2,pxx=W/2-pw3/2;
        g.globalAlpha=pa;panel(pxx,py3,pw3,ph3,ph3/2,PANEL,p.c);g.fillStyle=p.c;g.beginPath();g.arc(pxx+U*1.3,pcy,U*.28,0,7);g.fill();tx(p.s,pxx+U*2.2,pcy+U*.33,U*.95,TXT1,600,'left');g.globalAlpha=1})}
  }
  if(banner>0&&state==='play'){g.globalAlpha=Math.max(0,Math.min(1,banner/40,(150-banner)/15+.02));tx('STAGE '+(lvl+1),W/2,H*.32,U*3,TXT1,800,'center',U*.5);tx(NAMES[pi()].toUpperCase(),W/2,H*.32+U*1.9,U*.85,pal[4],700,'center',U*.5);g.globalAlpha=1}
  if(state==='dead'||paused){
    MB=[];g.fillStyle='rgba(4,6,18,.6)';g.fillRect(0,0,W,H);
    var cw=Math.min(W*.86,U*15),ch=Math.min(U*19,H-U*.8),cx3=W/2-cw/2,cy3=Math.max(U*.4,(H-ch)/2),bw4=cw-U*3.2,bx4=W/2-bw4/2;
    panel(cx3,cy3,cw,ch,U*1.3,'rgba(12,16,34,.94)','rgba(255,255,255,.14)');
    tx(paused?'PAUSED':(DIFF[diff].tmr&&tleft<=0?'TIME UP':'GAME OVER'),W/2,cy3+U*2.6,U*.85,paused?pal[4]:TXT2,700,'center',U*.5);
    tx(''+sc,W/2,cy3+U*6.8,U*4.6,TXT1,800);
    if(!paused&&newBest){panel(W/2-U*3.2,cy3+U*8.2,U*6.4,U*1.8,U*.9,pal[4],null);tx('NEW BEST',W/2,cy3+U*9.4,U*.75,'#07091a',800,'center',U*.2)}
    else tx('Best '+best,W/2,cy3+U*9.2,U*.95,TXT2,600);
    tx(lvLabel()+'  \u00b7  Stage '+(lvl+1),W/2,cy3+U*11.4,U*.75,TXT3,600);
    button(paused?'resume':'retry',paused?'Resume':'Retry',bx4,cy3+U*12.4,bw4,U*2.8,true,pal);
    button('tomenu','Menu',bx4,cy3+U*15.8,bw4,U*2.3,false,pal);
  }
  if(tT>0){g.font='600 '+U*.9+'px '+FONT;var tw4=g.measureText(tMsg).width+U*2.8,th4=U*2.2,ty4=state==='ready'?H-U*2.8:H-U*14;g.globalAlpha=Math.min(1,tT/15);panel(W/2-tw4/2,ty4,tw4,th4,th4/2,'rgba(12,16,34,.92)',STROKE);tx(tMsg,W/2,ty4+th4/2+U*.32,U*.9,TXT1,600);g.globalAlpha=1}
hoverUpdate(pal);}
function hoverUpdate(pal){
  var hs=state==='ready'||state==='dead'||paused,ents=[],hot=null,i,k,seen={};
  if(hs)ents=MB;
  else if(state==='play'){ents=[{id:'pause',x:PB.x,y:PB.y,w:PB.s,h:PB.s,own:1}];if(ball.inv>=0)ents.push({id:'power',x:BTN.x,y:BTN.y,w:BTN.s,h:BTN.s,own:1})}
  for(i=ents.length-1;i>=0;i--){var e=ents[i];if(pmx>=e.x&&pmx<=e.x+e.w&&pmy>=e.y&&pmy<=e.y+e.h){hot=e;break}}
  var hid=hot?hot.id:null;
  ents.forEach(function(e){seen[e.id]=1;var v=HV[e.id]||0;HV[e.id]=v+((e.id===hid?1:0)-v)*.22});
  for(k in HV)if(!seen[k]){HV[k]*=.7;if(HV[k]<.01)delete HV[k]}
  if(hid!==lastHot){lastHot=hid;if(hid)snd(1250,.04,'sine',.02,1700);var cur=hot?(hot.lk?'not-allowed':'pointer'):'';if(cv.style.cursor!==cur)cv.style.cursor=cur}
  if(!hs)return;
  ents.forEach(function(e){var v=HV[e.id];if(e.own||!(v>.01))return;
    g.save();g.globalAlpha=v*(e.lk?.35:1);rr(e.x,e.y,e.w,e.h,e.rd||U*.9);g.fillStyle='rgba(255,255,255,.08)';g.shadowColor=e.hc||pal[4];g.shadowBlur=U*.9;g.fill();g.shadowBlur=0;g.strokeStyle=e.hc||pal[4];g.lineWidth=Math.max(1.5,U*.1);g.stroke();g.restore()})}
var acc=0,prev=performance.now();
function loop(t){acc+=Math.min(100,t-prev);prev=t;while(acc>=1000/60){step();acc-=1000/60}
  if(eg){eg.gain.value=0;eng.frequency.value=55+speed*280}
  draw();requestAnimationFrame(loop)}
function ptr(e){steer=e.clientX<innerWidth/2?-1:1}
cv.addEventListener('pointerdown',function(e){e.preventDefault();window.focus();
  var d=W/innerWidth,px=e.clientX*d,py=e.clientY*d;
  if(state==='ready'){MB.forEach(function(b){if(px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h)menuAct(b.id)});return}
  if(state==='dead'||paused){MB.forEach(function(b){if(px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h)menuAct(b.id)});return}
  if(state==='play'&&px>=PB.x&&px<=PB.x+PB.s&&py>=PB.y&&py<=PB.y+PB.s){paused=true;return}
  if(state==='play'&&!paused&&ball.inv>=0&&px>=BTN.x&&px<=BTN.x+BTN.s&&py>=BTN.y&&py<=BTN.y+BTN.s){usePower();return}
  ptr(e);sy0=e.clientY;if(paused)paused=false;start()});
cv.addEventListener('pointermove',function(e){if(e.pointerType==='mouse'){var d=W/innerWidth;pmx=e.clientX*d;pmy=e.clientY*d}if(e.buttons||e.pointerType==='touch')ptr(e)});
cv.addEventListener('pointerleave',function(){pmx=pmy=-1e9});
cv.addEventListener('pointerdown',function(e){if(e.pointerType==='mouse'){var d=W/innerWidth;pmx=e.clientX*d;pmy=e.clientY*d}else pmx=pmy=-1e9},true);
addEventListener('pointerup',function(e){if(e.pointerType!=='mouse')pmx=pmy=-1e9});
addEventListener('pointerup',function(){steer=0});
function key(e,v){
  var k=(e.key||'').toLowerCase(),c=e.code;
  if(k==='a'||k==='arrowleft'||c==='KeyA'||c==='ArrowLeft'){keyL=v;if(v&&state!=='ready')start();e.preventDefault()}
  else if(k==='d'||k==='arrowright'||c==='KeyD'||c==='ArrowRight'){keyR=v;if(v&&state!=='ready')start();e.preventDefault()}
  else if(v&&(k===' '||k==='enter'||c==='Space')){if(state==='ready'){if(lvOpen)pickLevel(diff);else lvOpen=true}else start();e.preventDefault()}
  else if(v&&k==='escape'&&state==='ready'&&(lvOpen||skinOpen||helpOpen||msOpen||dayOpen||awOpen||wkOpen||xtOpen)){lvOpen=skinOpen=helpOpen=msOpen=dayOpen=awOpen=wkOpen=xtOpen=false}
  else if(v&&(k==='p'||k==='escape')){if(state==='play')paused=!paused;else if(state==='dead'){if(wk||diff>3){wk=false;diff=prevDiff;best=bestOf(diff)}reset();state='ready'}}
  else if(v&&(k==='f'||c==='KeyF'))usePower();
  else if(v&&k==='h'&&state==='ready')helpOpen=!helpOpen;
  else if(v&&k==='m'){muted=!muted;tMsg=muted?'Sound off':'Sound on';tT=70}
  else if(v&&k==='t')nextTheme();
}
addEventListener('keydown',function(e){if(!e.repeat)key(e,1)});
addEventListener('keyup',function(e){key(e,0)});
addEventListener('blur',function(){keyL=0;keyR=0;steer=0;if(state==='play')paused=true});
document.addEventListener('visibilitychange',function(){if(document.hidden&&state==='play')paused=true});
window.focus();reset();requestAnimationFrame(loop);
})();
